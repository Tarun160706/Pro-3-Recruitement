# ==========================================
# TalentIQ Application Configuration
# ==========================================
spring.application.name=talentiq-backend
server.port=8080

# Database Configuration (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/talentiq_db?sslmode=disable}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Multipart / File Upload Configuration (Max 10MB per resume PDF)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Authentication Configuration
talentiq.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
talentiq.jwt.expiration-ms=86400000

# Gemini AI Service Configuration
talentiq.gemini.api-key=${GEMINI_API_KEY:AIzaSyB8ZI1-z22WkctyeeWW-RSuAWMD8tgPHr0}
talentiq.gemini.model=${GEMINI_MODEL:gemini-3.5-flash}
talentiq.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}

# CORS Configuration
talentiq.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Email Service Configuration (SMTP)
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}

# App & Auth Configuration
talentiq.mail.from=${MAIL_FROM:no-reply@talentiq.ai}
talentiq.app.frontend-url=${FRONTEND_URL:http://localhost:5173}
talentiq.cookie.secure=${COOKIE_SECURE:false}
talentiq.admin.email=${ADMIN_EMAIL:admin@talentiq.ai}
talentiq.admin.password=${ADMIN_PASSWORD:Admin#2026!}
talentiq.admin.name=${ADMIN_NAME:TalentIQ Administrator}
